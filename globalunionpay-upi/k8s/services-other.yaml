apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: globalunionpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: ghcr.io/arthikhs/globalunionpay-transaction-service:latest
          ports:
            - containerPort: 8086
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: gup-config
                  key: SPRING_DATASOURCE_URL_POSTGRES
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: gup-config
                  key: SPRING_DATASOURCE_USERNAME_POSTGRES
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gup-secrets
                  key: postgres-password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: gup-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: globalunionpay
spec:
  selector:
    app: transaction-service
  ports:
    - port: 8086
      targetPort: 8086
---
