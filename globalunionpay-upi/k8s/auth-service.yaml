apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: globalunionpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/arthikhs/globalunionpay-auth-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: gup-config
                  key: SPRING_DATASOURCE_URL_MYSQL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: gup-config
                  key: SPRING_DATASOURCE_USERNAME_MYSQL
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gup-secrets
                  key: mysql-root-password
            - name: SPRING_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: gup-config
                  key: SPRING_REDIS_HOST
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: gup-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: globalunionpay
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
