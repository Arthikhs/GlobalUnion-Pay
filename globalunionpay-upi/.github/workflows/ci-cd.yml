name: GlobalUnion Pay CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: globalunionpay

jobs:
  # ─── Backend Build & Test ───────────────────────────────────────────────────
  backend-build:
    name: Build & Test Backend Services
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: globalunionpay_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Auth Service
        run: mvn clean package -DskipTests
        working-directory: backend/auth-service

      - name: Test Auth Service
        run: mvn test
        working-directory: backend/auth-service

      - name: Build UPI Service
        run: mvn clean package -DskipTests
        working-directory: backend/upi-service

      - name: Build Payment Service
        run: mvn clean package -DskipTests
        working-directory: backend/payment-service

      - name: Build User Service
        run: mvn clean package -DskipTests
        working-directory: backend/user-service

      - name: Build Wallet Service
        run: mvn clean package -DskipTests
        working-directory: backend/wallet-service

      - name: Build Transaction Service
        run: mvn clean package -DskipTests
        working-directory: backend/transaction-service

      - name: Build Notification Service
        run: mvn clean package -DskipTests
        working-directory: backend/notification-service

      - name: Build Fraud Service
        run: mvn clean package -DskipTests
        working-directory: backend/fraud-service

      - name: Build Merchant Service
        run: mvn clean package -DskipTests
        working-directory: backend/merchant-service

      - name: Build Analytics Service
        run: mvn clean package -DskipTests
        working-directory: backend/analytics-service

      - name: Build API Gateway
        run: mvn clean package -DskipTests
        working-directory: backend/api-gateway

  # ─── Frontend Build ──────────────────────────────────────────────────────────
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ─── Docker Build & Push ─────────────────────────────────────────────────────
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [ backend-build, frontend-build ]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: backend/auth-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-auth-service:latest

      - name: Build and push upi-service
        uses: docker/build-push-action@v5
        with:
          context: backend/upi-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-upi-service:latest

      - name: Build and push payment-service
        uses: docker/build-push-action@v5
        with:
          context: backend/payment-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-payment-service:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-frontend:latest

  # ─── Deploy to AWS ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            cd /opt/globalunionpay
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker system prune -f
            echo "Deployment completed at $(date)"
