server:
  port: 8089

spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:mysql://localhost:3306/globalunionpay_analytics?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-service-group
      auto-offset-reset: earliest

jwt:
  secret: globalunionpay-analytics-secret-key-2024-very-long-secret
